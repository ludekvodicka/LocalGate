name: Release

on:
  push:
    tags: ["v*"]

# Publishing runs on npm's trusted publishing: npm mints a short-lived token from this workflow's OIDC
# identity, so there is no NPM_TOKEN in this repository and nothing to rotate. It works only once the
# package on npmjs.com names this repository and this file as its trusted publisher.
jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads the pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Node 24 still bundles npm 11.4.1, and OIDC publishing needs 11.5.1 or newer. Without this the
      # publish falls back to asking for a token and fails with an authentication error that says
      # nothing about the real cause.
      - name: Upgrade npm to a version that can publish over OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is cut from a commit CI already checked, but a release is the one thing worth checking
      # twice: what ships to npm is this tree, not the one the tag was reviewed on.
      - name: Verify
        run: pnpm run verify

      - name: Check the tag matches the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
